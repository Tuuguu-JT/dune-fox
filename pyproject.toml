[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dune-fox"
version = "0.1.0"
description = "Plug-and-play FLYDIGI Dune Fox reader over FlySync / XInput"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dune-fox = "dune_fox.cli:main"

[tool.setuptools.packages.find]
include = ["dune_fox*"]
