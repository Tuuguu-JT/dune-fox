[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dune-fox"
version = "0.1.0"
description = "Poll a FLYDIGI Dune Fox on Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
py-modules = ["dune_fox"]
